<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10170f" />
    <meta name="description" content="Blockfall — 3D voxel FPS tower defense roguelite." />
    <title>Blockfall — 3D FPS Foundation</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="debug"></div>
      <div id="status">FPS FOUNDATION · ISSUE #3</div>

      <div id="start-overlay" class="overlay">
        <div class="panel">
          <div class="eyebrow">BLOCKFALL · 3D REWRITE</div>
          <h1>FPS FOUNDATION</h1>
          <p>Primeira fundação 3D do Blockfall. Este cenário é temporário: serve para validar câmera, movimentação e colisão antes da voxel engine.</p>
          <div class="controls">
            <span><b>WASD</b> mover</span>
            <span><b>Mouse</b> olhar</span>
            <span><b>Space</b> pular</span>
            <span><b>Shift</b> correr</span>
            <span><b>Esc</b> soltar mouse</span>
          </div>
          <button id="play-button">ENTRAR NO TESTE 3D</button>
          <small id="loading-label">Inicializando física...</small>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
